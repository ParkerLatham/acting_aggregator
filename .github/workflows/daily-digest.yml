name: Daily casting digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 9:00 AM Eastern (8:00 AM in winter)
  workflow_dispatch:         # lets you press "Run workflow" manually to test

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen.json is kept between runs with the Actions cache, so the repo
      # never contains it and each run only emails new listings.
      - name: Restore seen.json
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Build and email the digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: python main.py --email
